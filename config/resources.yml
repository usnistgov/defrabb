################################################################################
#                 defrabb resource configuration file
#
# Includes
# - parameters, threads, and memory for compute intensive steps
# - urls for remote files: diploid assemblies, genome reference files, stratifications,
#   and callsets used to evaluate draft benchmark
# - exclusion sets and how they are applied.
#
################################################################################
analyses: "config/analyses.tsv"

# Set to true to emit verbose output from tools that support it
# (currently: get_sv_widen_coords.py, hap.py via run_happy.py).
debug: false

################################################################################
# Rule compute resource requirements and data dependencies

## Dipcall Resources ##############
# the number of dipcall threads to use
_dipcall_threads: 5

# the number of parallel jobs for dipcall's call to make - 2 or one per haplotype
_dipcall_jobs: 4

# Mem per job (MB). Dipcall peaks at ~102-116 GB total across jobs (measured
# 2026-06-23: CHM13 116 GB, GRCh38 103 GB). With 4 jobs, 40000/job = 160 GB
# total reservation (margin over observed 116 GB).
_dipcall_mem: 40000

# Parameters
_dipcall_params:
  z2k: "-z200000,10000"

  # the root of the par file for dipcall (and friends)
_par_bed_root: data/par_bed

## PAV Resources ##############
_pav_config:
  giab:
    merge_ins: "nr::exact"
    merge_del: "nr::exact"
    merge_inv: "nr::exact:ro(0.5):szro(0.5,200):match"

_pav_threads: 24

## Concurrency cap for PAV's memory-heavy `call_cigar` rule inside the nested PAV
## Snakemake. `call_cigar` declares no threads/resources, so PAV would otherwise
## schedule up to `_pav_threads` of them at once; each accumulates one pandas
## Series per called variant (see pavlib/cigarcall.py::make_insdel_snv_calls), so
## RSS scales with a batch's variant count. Under full concurrency the
## highest-variant batches were silently killed (likely a transient memory spike).
## run_pav passes `--set-threads call_cigar=<this>`, capping concurrency to
## floor(_pav_threads / _pav_cigar_threads). See
## docs/issues/run_pav_run_dipcall_failures.md (bug F).
_pav_cigar_threads: 8

## Container image for the PAV variant caller (docker:// URI or a local
## Apptainer SIF path). The published image works as-is; on FIPS hosts its
## bundled pysam OpenSSL would crash, but run_defrabb auto-binds
## /proc/sys/crypto/fips_enabled -> 0 to neutralize that (see
## docs/issues/run_pav_fips_selftest.md). Override only to pin a different
## image/digest or a custom local SIF.
_pav_container: "docker://becklab/pav:latest"

## Peak RSS reservation (MB) for run_pav. PAV peaks at ~65 GB RSS on whole-genome
## HG002 (measured 2026-06-23). Reserved so the global --resources mem_mb budget
## serializes it against other memory-heavy rules. Sized with 25% margin.
_pav_mem: 80000

## Happy Resources ################
_happy_threads: 12

## hap.py peak RSS reaches ~95-151 GB on whole-genome HG002/HG008 (measured
## on prior runs). Sized to cover the observed peak + margin.
_happy_mem: 160000

## Truvari Resources ##############
_truvari_refine_threads: 24

## Peak RSS reservations (MB). truvari bench is light (~200 MB) but refine
## (mafft) and the anno passes are heavier; reserved so they count against the
## global mem_mb budget.
_truvari_mem: 32000
_truvari_anno_mem: 16000
_truvari_anno_threads: 8

## Truvari bench parameter profiles ##########
# Selected per-analysis via the analyses-table `eval_params` column. The
# `default` profile reproduces the previously hardcoded run_truvari parameters.
# To tune matching (e.g. per JZ/Illumina/Adam guidance, #194), add a named
# profile and set `eval_params` to its name. Supported keys: pick, passonly,
# refdist, chunksize, pctseq, pctsize, pctovl, sizemin, sizemax, sizefilt,
# typeignore, dup_to_ins, bnddist.
truvari_bench_params:
  # Historical hardcoded command — pinned for reproducing released draft
  # benchmarks. Do not change; new recommendations go in new profiles.
  default:
    pick: ac
    passonly: true
    refdist: 2000
    chunksize: 5000
  # Truvari v5 recommended bench params for the Q100 SV (stvar) benchmark.
  # bnddist=-1 disables BND distance matching: the Q100 SV benchmark has no
  # BND records, so without this every query BND scores as a FP (Illumina /
  # S. Truong, Aug 2025 email thread, GitLab #194). Refine intentionally omits
  # --write-phab, following the truvari v5 default (A. English / J. Zook) for
  # stable, comparison-set-independent baseline counts.
  stvar_v5:
    pick: ac
    passonly: true
    refdist: 2000
    chunksize: 5000
    bnddist: -1

## Exclusion Parameters ##########
# Parameters controlling how exclusion regions are generated and applied.
# These are tunable per-genome when optimizing benchmark regions.
_exclusion_params:
  # Buffer added around exclusion regions (bp)
  slop: 15000
  # Merge distance for slop+merge operations (bp)
  slopmerge_dist: 10000
  # Buffer around assembly breaks / flanks (bp)
  flank_bases: 15000
  # SV and repeat intersection parameters
  sv_repeat_slop: 50
  sv_repeat_merge_dist: 1000
  # Self-discrepancy parameters
  self_discrep_max_indel: 50
  self_discrep_slop: 50
  self_discrep_merge_dist: 1000
  # PAV inversion exclusion parameters
  pav_inv_slop: 50
  pav_inv_merge_dist: 1000
  # Consecutive SV minimum size (bp)
  consecutive_sv_min_bp: 10
  # Minimum N-stretch length for gap detection (bp)
  gap_min_ns: 50
  # Per-exclusion parameter overrides (optional; omit to use globals above).
  # Supported keys per exclusion: slop (int bp), slop_pct (float 0-1), slopmerge_dist (int bp).
  # slop_pct and slop are mutually exclusive — slop_pct activates bedtools slop -pct.
  # Example:
  #   overrides:
  #     tandem-repeats:
  #       slop_pct: 0.25
  #     segdups:
  #       slop: 20000
  overrides: {}

## VCF Processing Profiles ##########
# Named profiles defining ordered sequences of VCF processing steps.
# Each profile maps to a list of step names that are chained by Snakemake
# to produce the final benchmark VCF.
vcf_processing_profiles:
  # TRF annotation only
  trf:
    - trfanno
  # TRF + SV info + low-complexity regions (common for structural variants)
  trf_sv_lcr:
    - trfanno
    - svinfo
    - lcr
  # XY genotype fix only
  xy_fix:
    - fix_XY_genotype
  # XY genotype fix + TRF annotation
  xy_trf:
    - fix_XY_genotype
    - trfanno
  # XY + END tag + TRF + remove inversions
  xy_end_trf_no_inv:
    - fix_XY_genotype
    - end_info
    - trfanno
    - no_inv
  # Full normalized annotation: norm + XY + TRF + SV info + LCR
  norm_xy_trf_sv_lcr:
    - norm
    - fix_XY_genotype
    - trfanno
    - svinfo
    - lcr
  # Full normalized annotation with END tag
  norm_xy_end_trf_sv_lcr:
    - norm
    - fix_XY_genotype
    - end_info
    - trfanno
    - svinfo
    - lcr

## VCF Processing Parameters ##########
_vcf_processing_params:
  # Minimum variant length for truvari annotations (bp)
  truvari_anno_min_length: 20
  # Maximum insertion length for truvari trf annotation (bp)
  # Insertions larger than this bypass TRF (kept in output, un-annotated)
  truvari_anno_max_ins_length: 100000
  # Minimum SV size for svinfo annotation (bp)
  truvari_svinfo_minsize: 20

