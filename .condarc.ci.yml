# CI-specific conda configuration for NIST firewall environment
# Uses prefix.dev mirrors to avoid blocked anaconda.org domains

ssl_verify: false

# Use conda-forge and bioconda via prefix.dev mirrors
custom_multichannels:
  conda-forge:
    - https://prefix.dev/conda-forge
  bioconda:
    - https://prefix.dev/bioconda

channel_priority: strict
channels:
  - conda-forge
  - bioconda

# Block anaconda channel (may be firewalled)
disallow:
  - anaconda

# Route downloads through the institutional proxy. prefix.dev serves as the
# channel URL, but some package artifact requests still redirect to
# conda.anaconda.org, which is blocked from the runner without this proxy.
proxy_servers:
  http: http://kkjl338c0s.proxy.cloudflare-gateway.com
  https: https://kkjl338c0s.proxy.cloudflare-gateway.com
