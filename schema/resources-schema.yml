$schema: "https://json-schema.org/draft/2020-12/schema"
description: downloadable resources for whole genome assembly benchmark pipeline
required:
  - references
  - assemblies
  - comparisons
  - exclusion_set
  - exclusion_slop_regions
  - exclusion_slopmerge_regions
  - exclusion_asm_intersect
  - exclusion_asm_agnostic
  - exclusion_ref_agnostic
  - _dipcall_threads
  - _dipcall_jobs
  - _dipcall_mem
  - _dipcall_params
  - _pav_config
  - _pav_threads
  - _happy_threads
  - _happy_mem
  - _truvari_refine_threads
  - _exclusion_params
  - _vcf_processing_params
  - vcf_processing_profiles
  - _par_bed_root

additionalProperties: false
properties:

  analyses:
    additionalProperties:
    patternProperties:
      ^[\w\.\-]*tsv$:
        type: string
        description: File path to analyses tsv table

  debug:
    type: boolean
    description: When true, gate-verbose tools emit extra logging.

################################################################################
# resources - information for framework data dependencies, i.e. reference genomes
  references:
    additionalProperties: false
    patternProperties:

      ^GRCh3[7,8]|GRCh38_chr21|CHM13v[0-9].[0-9]$:
        type: object
        description: metadata for reference genomes
        properties:

          ref_url:
            type: string
            description: URL or local filesystem path to the reference FASTA file

          par_bed:
            type: string
            description: |
              File name of the PAR.bed file used for the -x flag in
              'run-dipcall'; will be prefixed with the value of 'par_bed_root'

          adotto_db:
            type: string
            description: |
              URL or local path for the adotto TR database used in tandem repeat annotation with `truvari anno trf`

          exclusions:
            description: The beds to use when generating the exclusions
            additionalProperties: false
            patternProperties:
              ^[\w\.\-]*$:
                type: string

          stratifications:
            description: |
              The stratification set to be used.
            required: [id, url, tarball, tsv]
            properties:
              id:
                format: string
                description: stratification set id
              url:
                type: string
                description: URL or local path to the tarball with the stratification files
              tarball:
                format: string
                description: name of the stratification tarball file
              tsv:
                format: string
                description: name of the stratification tsv file used by happy

        required: [ref_url, par_bed]

  assemblies:
    description: |
      The assemblies to be used in the pipeline; each key is an identifier that
      will be referenced in other sections.
    additionalProperties: false
    unique: true
    patternProperties:

      ^[\w\.\-]*$:
        type: object
        additionalProperties: false
        description: metadata for each assembly
        required: [maternal, paternal, is_male]
        properties:

          maternal:
            type: string
            description: URL or local path to the maternal FASTA assembly file

          paternal:
            type: string
            description: URL or local path to the paternal FASTA assembly file

          is_male:
            type: boolean
            description: true if this assembly to be processed as a male genome

          sample_id:
            type: string
            description: sample name used in sample renaming (e.g. dipcall vcf output)

  comparisons:
    description: |
      The comparison variant callsets to be used in evaluating draft benchmark sets; each key is an identifier that
      will be referenced in other sections.
    additionalProperties: false
    patternProperties:

      ^GRCh3[7,8]|GRCh38_chr21|CHM13v[0-9].[0-9]$:
        type: object
        description: reference genome id

        properties:
          ^[\w\.\-]*$:
            type: object
            additionalProperties: false
            description: metadata for comparison variant callset
            required: [vcf_url]
            properties:

              vcf_url:
                type: string
                description: URL or local path to the comparison vcf file

              bed_url:
                type: string
                description: |
                  URL or local path to the comparison bed file,
                  e.g. benchmark regions for benchmark sets.

              tbi_url:
                type: string
                description: URL or local path to the comparison vcf index file

  vcf_processing_profiles:
    description: |
      Named profiles defining ordered sequences of VCF processing steps for
      benchmark generation. Each key is a profile name, each value is an
      ordered list of step names that are chained by Snakemake.
    additionalProperties: false
    patternProperties:
      ^[\w\.\-]*$:
        type: array
        description: ordered list of processing steps
        items:
          type: string

  exclusion_set:
    description: |
      The exclusions which may be applied to the output of dipcall. Each key is
      a list of bed files, with a (hopefully) self-explanatory name for what
      is being excluded.
    additionalProperties: false
    patternProperties:

      ^[\w\.\-]*$:
        type: array
        description: the list of exclusions in an exclusion set
        items:
          type: string
          format: ^.*$

  exclusion_slop_regions:
    description: |
      Exclusions regions where slop is applied before exclusion or
      identification of diploid assembly coverage.
    additionalProperties: false
    patternProperties:

      ^[\w\.\-]*$:
        type: array
        description: the list of exclusions to apply slop to
        items:
          type: string
          format: ^.*$

  exclusion_slopmerge_regions:
    description: |
      Exclusion regions where where slop is applied then merged
      before exclusion or identification of diploid assembly coverage.
    additionalProperties: false
    patternProperties:

      ^[\w\.\-]*$:
        type: array
        description: the list of exclusions to apply slop to
        items:
          type: string
          format: ^.*$

  exclusion_asm_intersect:
    description: |
      Exclusions regions where only incompletely assembled regions are excluded.
    additionalProperties: false
    patternProperties:

      ^[\w\.\-]*$:
        type: array
        description: the list of exclusions exclude based on assembly coverage
        items:
          type: string
          format: ^.*$

  exclusion_asm_agnostic:
    description: |
      Exclusions whose genomic regions are not dependent on the diploid assembly.
    additionalProperties: false
    patternProperties:

      ^[\w\.\-]*$:
        type: array
        description: the list of exclusions excluded for all assemblies
        items:
          type: string
          format: ^.*$

  exclusion_ref_agnostic:
    description: |
      Exclusions whose genomic regions are not dependent on the reference genome.
    additionalProperties: false
    patternProperties:

      ^[\w\.\-]*$:
        type: array
        description: the list of exclusions independent of reference genome
        items:
          type: string
          format: ^.*$

################################################################################
# Rule Resource Requirements

  _dipcall_threads:
    description: the number of threads per dipcall step, e.g. minimap2
    exclusiveMinimum: 0
    type: integer

  _dipcall_jobs:
    description: the number of jobs for dipcall to run in parallel, i.e. number passed to make -j argument
    exclusiveMinimum: 0
    type: integer

  _dipcall_mem:
    description: memory required per dipcall job, in mbs i.e. 1000 ~ 1Gb of ram
    exclusiveMinimum: 0
    type: integer

  _dipcall_params:
    description: command line parameters used for dipcall run
    type: object

  _pav_config:
    description: parameters for pav config file
    type: object

  _pav_threads:
    description: the number of threads for pav (sub pipeline)
    exclusiveMinimum: 0
    type: integer

  _happy_threads:
    description: the number of threads for happy runs
    exclusiveMinimum: 0
    type: integer

  _happy_mem:
    description: memory required per happy run, in mbs i.e. 1000 ~ 1Gb of ram
    exclusiveMinimum: 0
    type: integer

  _truvari_refine_threads:
    description: the number of threads for truvari refine runs
    exclusiveMinimum: 0
    type: integer

  _exclusion_params:
    type: object
    properties:
      slop:
        type: integer
        minimum: 0
      slopmerge_dist:
        type: integer
        minimum: 0
      flank_bases:
        type: integer
        minimum: 0
      sv_repeat_slop:
        type: integer
        minimum: 0
      sv_repeat_merge_dist:
        type: integer
        minimum: 0
      self_discrep_max_indel:
        type: integer
        minimum: 0
      self_discrep_slop:
        type: integer
        minimum: 0
      self_discrep_merge_dist:
        type: integer
        minimum: 0
      pav_inv_slop:
        type: integer
        minimum: 0
      pav_inv_merge_dist:
        type: integer
        minimum: 0
      consecutive_sv_min_bp:
        type: integer
        minimum: 0
      gap_min_ns:
        type: integer
        minimum: 0
      overrides:
        type: object
        description: |
          Per-exclusion parameter overrides. Each key is an exclusion region name;
          values override global slop/slopmerge_dist. slop_pct (float 0-1) activates
          bedtools slop -pct and is mutually exclusive with slop.
        default: {}
        additionalProperties: false
        patternProperties:
          ^[\w\.\-]*$:
            type: object
            additionalProperties: false
            properties:
              slop:
                type: integer
                minimum: 0
              slop_pct:
                type: number
                minimum: 0
                maximum: 1
              slopmerge_dist:
                type: integer
                minimum: 0
    required:
      - slop
      - slopmerge_dist
      - flank_bases
      - sv_repeat_slop
      - sv_repeat_merge_dist
      - self_discrep_max_indel
      - self_discrep_slop
      - self_discrep_merge_dist
      - pav_inv_slop
      - pav_inv_merge_dist
      - consecutive_sv_min_bp
      - gap_min_ns

  _vcf_processing_params:
    type: object
    properties:
      truvari_anno_min_length:
        type: integer
        minimum: 1
      truvari_svinfo_minsize:
        type: integer
        minimum: 1
    required:
      - truvari_anno_min_length
      - truvari_svinfo_minsize

## Rule Resource Dependencies
  _par_bed_root:
    description: |
      Path to the directory with par files used for the -x flag in 'run-dipcall'
    type: string
