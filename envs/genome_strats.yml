channels:
  - conda-forge
  - bioconda
dependencies:
  # bedtools is left unpinned: vcflib 1.0.15 requires libzlib >=1.3.2, which the
  # pinned bedtools=2.31.0 used elsewhere conflicts with. The interval algebra
  # here is version-insensitive.
  - vcflib=1.0.15
  - bedtools
  - htslib
  - python>=3.9
