channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::truvari ==5.4.0
  # bwapy is intentionally absent. Two blockers prevent installing it:
  #   1. conda env YAML pip block does not support `--no-build-isolation`,
  #      which is required to build the ACEnglish/bwapy fork against
  #      setuptools <80 (the fork's setup.py imports pkg_resources, which
  #      was split out of setuptools >=80).
  #   2. bwapy 0.1.4 (both the bioconda package and a locally built fork)
  #      fails to load on this workstation with `undefined symbol:
  #      __log_finite` due to glibc finite-math compat. RUNTIME failure,
  #      not build.
  # CI's default analyses.tsv does not exercise anno_remap. Active HG008
  # dipcall stvar analyses that include `.remap` will fail at runtime
  # until the follow-up issue resolves both blockers.
