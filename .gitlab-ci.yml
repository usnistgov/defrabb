variables:
  # Use libmamba solver for faster conda operations
  CONDA_SOLVER: libmamba
  # Use CI-specific conda config to work around NIST firewall.
  # The .yml suffix is required so Conda treats CONDARC as a config file.
  CONDARC: "${CI_PROJECT_DIR}/.condarc.ci.yml"

cache:
  # Share cache across branches since conda envs are deterministic by hash
  key: conda-envs-shared
  paths:
    - .snakemake/conda/

before_script:
  - source /home/gitlab-runner/miniforge3/etc/profile.d/conda.sh
  - conda activate defrabb-ci
  - echo "Pipeline tools (from pre-built defrabb-ci env)"
  - mamba --version
  - snakemake --version
  - snakefmt --version
  - black --version
  - pytest --version
  - apptainer --version
  - echo "Conda config (using ${CONDARC}):"
  - conda config --show-sources

smkformat:
  script:
    - echo "Running snakefmt --check"
    - snakefmt --check --diff . || (echo "Files needing format:"; find . -name '*.smk' -o -name 'Snakefile' | while read f; do snakefmt --check "$f" 2>&1 | grep -q "would be changed" && echo "$f"; done; exit 1)

pyformat:
  script:
    - echo "Running black --check"
    - black --check scripts/ .tests/

snakelint:
  # Advisory only: snakemake --lint flags best-practice issues (missing log:/
  # conda: directives on legacy rules) and exits non-zero. Surface them without
  # blocking the pipeline until those rules are cleaned up.
  allow_failure: true
  script:
    - echo "Running snakemake --lint (advisory)"
    - snakemake --lint

pytest:
  script:
    - echo "Running pytest"
    - pytest .tests

run-test:
  timeout: 30m
  artifacts:
    paths:
        - smalltest
    when: always
  script:
    - snakemake -p --use-conda --conda-frontend mamba --use-apptainer --cores 1 --verbose --dryrun
