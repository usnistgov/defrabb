image: condaforge/mambaforge:24.9.2-0

before_script:
  - apt update && apt install --yes build-essential
  - echo "Installing pipeline dependencies"
  - mamba --version
  - mamba install -c conda-forge -c bioconda --strict-channel-priority python==3.12.3 snakemake==8.30.0 snakefmt==0.10.2 apptainer==1.3.6 pytest==8.3.3
  - snakemake --version
  - black --version
  - pytest --version

# lint-test:
#   artifacts:
#     paths: 
#         - lint
#   script:
#     - snakemake --lint

smkformat:
  script:
    - echo "Running snakefmt"
    - snakefmt .

pytest:
  script:
    - echo "Running pytest"
    - pytest .tests

run-test:
  artifacts:
    paths: 
        - smalltest
  script:
    - snakemake -p --use-conda --use-apptainer --cores 1 --verbose --config "_happy_threads=1"
